[network]
#server ip-address for filtering the network traffic
server_ip = 192.168.0.63
#network interface for the capture
interface = Ethernet

[database]
type = sqlite
connection_string= sqlite:///./app.db

[logging]
# log level can be DEBUG, INFO, WARNING, ERROR, CRITICAL
app_log_level = DEBUG
message_service_log_level = DEBUG
aggregator_log_level = DEBUG
call_context_log_level = DEBUG
database_log_level = DEBUG


[captured_file]
# relative or absolute
path = relative
file_path = data\Audio-Validation-3.pcapng
#file_path = data\correct_documentation.pcapng
#file_path = C:\Transfer\Audio-Validation-3.pcapng
#file_path = C:\Transfer\correct_documentation.pcapng
#file_path = C:\Transfer\Overlap-Validation-2.pcapng

[rabbitmq]
user = guest
password = guest
host = localhost
port = 5672

[audio_processing]
# parameters for audio processing
vad_mode = 3
default_sample_rate = 48000
#values in seconds (with a . not a comma)
gap_threshold = 1
allowed_gaps = 1
min_speech_duration = 1.5
# noise reduction parameters
noise_percentile = 50
noise_multiplier = 3

# parameters for bandpass filter
bandpass_min_frequency = 300
bandpass_max_frequency = 3400
bandpass_order = 4

[authentication]
secret_key = change-me
algorithm = HS256
access_token_expire_minutes = 30


[admin]
username = admin
# hashed with HS256 algorithm
password = change-me
