[network]
#server ip-address for filtering the network traffic
server_ip = 192.168.0.63
#network interface for the capture
interface = Ethernet

[database]
type = sqlite
connection_string= sqlite:///./app.db


[captured_file]
# relative or absolute
path = relative
file_path = data\correct_documentation.pcapng
#file_path = C:\Transfer\correct_documentation.pcapng

[rabbitmq]
user = guest
password = guest
host = localhost
port = 5672

[audio_processing]
# parameters for audio processing
vad_mode = 3
sample_rate = 48000
#values in seconds
gap_threshold = 1.0
allowed_gaps = 1.0
min_speech_duration = 0.8

# parameters for bandpass filter
bandpass_min_frequency = 300
bandpass_max_frequency = 3400
bandpass_order = 4