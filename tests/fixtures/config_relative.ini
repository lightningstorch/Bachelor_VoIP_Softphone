[network]
server_ip = 127.0.0.1
interface_linux = eth0
interface_windows = eth0

[database]
type = sqlite
connection_string = sqlite:///./db.sqlite3

[logging]
app_log_level = DEBUG
message_service_log_level = DEBUG
aggregator_log_level = DEBUG
call_context_log_level = DEBUG
database_log_level = DEBUG

[captured_file]
path = relative
file_path = data/file.wav

[rabbitmq]
host_linux = rabbitmq
host_windows = localhost
port = 5672
user = guest
password = guest

[audio_processing]
vad_mode = 3
default_sample_rate = 16000
gap_threshold = 0.1
allowed_gaps = 0.05
min_speech_duration = 0.5
noise_percentile = 0.1
noise_multiplier = 1.0
bandpass_min_frequency = 300
bandpass_max_frequency = 3400
bandpass_order = 5

[authentication]
secret_key = 123456789
algorithm = HS256
access_token_expire_minutes = 30


[admin]
username = admin
password = admin
