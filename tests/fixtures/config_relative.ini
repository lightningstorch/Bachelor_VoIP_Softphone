[network]
server_ip = 127.0.0.1
interface = eth0

[database]
type = sqlite
connection_string = sqlite:///./db.sqlite3

[captured_file]
path = relative
file_path = data/file.wav

[rabbitmq]
host = localhost
port = 5672
user = guest
password = guest

[audio_processing]
vad_mode = 3
sample_rate = 16000
gap_threshold = 0.1
allowed_gaps = 0.05
min_speech_duration = 0.5
noise_percentile = 0.1
noise_multiplier = 1.0
bandpass_min_frequency = 300
bandpass_max_frequency = 3400
bandpass_order = 5
